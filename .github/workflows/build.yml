name: Build, Sign & Release Android Kotlin Packages (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Kotlin Project, Keystore & Properties
        run: |
          # حذف أي ملفات محاكاة ويب قد تعيق بناء كوتلن
          rm -f preview.html || true

          # إعداد الأيقونات
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          if [ -f "app_icon.png" ]; then
            cp app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png || true
            cp app_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
            cp app_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
            cp app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          fi

          # إنشاء مفتاح التوقيع الرقمي الرسمي
          keytool -genkeypair -v -keystore release.keystore -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -storepass appmaker123 -keypass appmaker123 -dname "CN=AppMaker, OU=Mobile, O=AppMaker, L=Algiers, S=Algiers, C=DZ"
          mkdir -p app
          cp release.keystore app/release.keystore || true

          # كتابة gradle.properties لضبط الذاكرة وتفادي انهيار بناء الموارد
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # التأكد من وجود settings.gradle سليم
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "include ':app'" > settings.gradle
          fi

      - name: Compile and Assemble Android Packages
        run: |
          gradle assembleRelease bundleRelease -x lint -x test --stacktrace --no-daemon

      - name: Sign Android Release Packages
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          # توقيع ومحاذاة ملفات APK
          find app/build/outputs/apk/release -name "*.apk" | while read APK_FILE; do
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_FILE" aligned.apk || cp "$APK_FILE" aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:appmaker123 --key-pass pass:appmaker123 --out -release.apk aligned.apk
            break
          done

          # استخراج ملف AAB
          find app/build/outputs/bundle/release -name "*.aab" | while read AAB_FILE; do
            cp "$AAB_FILE" -release.aab
            break
          done

      - name: Publish Release Packages to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0
          name: " v1.0.0 (Official Release)"
          files: |
            *-release.apk
            *-release.aab
            release.keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
